<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florista - Book a Visit</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Page-specific styles */
.booking-container {
  max-width: 600px;
  margin: 60px auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  background-color: #fff;
}

.booking-container h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #e91e63;
}

.booking-container p {
  text-align: center;
  margin-bottom: 30px;
  color: #555;
}

.booking-container form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, select, textarea, button {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 1rem;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #e91e63;
  box-shadow: 0 0 0 1px #e91e63;
}

button {
  background-color: #e91e63;
  color: #fff;
  font-weight: bold;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #d81b60;
}

footer {
  text-align: center;
  margin-top: 60px;
  padding: 20px;
  color: #666;
  font-size: 0.875rem;
}
</style>
</head>
<body>

<header class="container">
  <h1>Florista</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="#booking">Book a Visit</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<main class="booking-container">
  <h1>Schedule a Visit</h1>
  <p>Choose a date and time for us to come out and visit your business.</p>

  <form onsubmit="handleBooking(event)">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <label for="date">Select a Date:</label>
    <input type="date" id="date" name="date" required>
    <label for="time">Select a Time:</label>
    <input type="time" id="time" name="time" required>
    <textarea name="notes" placeholder="Additional Notes" rows="4"></textarea>
    <button type="submit">Book Visit</button>
    <p id="confirmationMsg" style="display:none; color:green; text-align:center; margin-top:10px;">Thank you! Your booking has been received.</p>
  </form>
</main>

<footer>
  © 2025 Florista. All rights reserved.
</footer>

<script>
function handleBooking(e){
  e.preventDefault();
  // In production, send form data to your server here
  const msg = document.getElementById('confirmationMsg');
  msg.style.display = 'block';
  e.target.reset();
  setTimeout(() => { msg.style.display='none'; }, 5000);
}
</script>

</body>
</html>
